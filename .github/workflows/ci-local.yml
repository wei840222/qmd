name: CI (local)

on:
  push:
    branches: [local]
  pull_request:
    branches: [local]

jobs:
  test-node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SQLite (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies from the frozen pnpm lockfile
        run: pnpm install --frozen-lockfile

      - name: Audit high and critical dependency vulnerabilities
        run: pnpm audit --audit-level high

      - name: Tests
        run: pnpm test:unit
        env:
          CI: true

  test-bun:
    name: Bun (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["24"]

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install SQLite (Ubuntu)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Verify lockfile is up-to-date
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test --timeout 60000 --preload ./src/test-preload.ts test/
        env:
          CI: true
          LD_LIBRARY_PATH: /usr/lib/x86_64-linux-gnu

      - name: Packed package smoke (Node and Bun)
        run: bun run test:package
