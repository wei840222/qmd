# QMD Collections Configuration
# Location: ~/.config/qmd/index.yml
#
# CLI collection/context commands manage this file; you can also edit it.
# New CLI processes read the changes. Restart a long-running MCP server after
# collection or model changes. Reconcile manual collection/context edits with
# `qmd ls` first; read-only MCP does not synchronize YAML into SQLite.
# Editing does not re-index; run `qmd update` explicitly after changing paths,
# patterns, or ignore lists. A missing collection root is skipped, not treated
# as deletion of every indexed document.
#
# Copy this file to ~/.config/qmd/index.yml and customize it.

# ─── Global context ──────────────────────────────────────────────────────────
# Prepended to results across ALL collections. Use it for conventions that span
# your whole knowledge base. Set via: qmd context add / "..."
global_context: "If you see a relevant [[WikiWord]], you can search for that WikiWord to get more context."

# ─── Terminal hyperlinks (optional) ──────────────────────────────────────────
# Template that turns result paths into clickable editor links.
# Overridden by the QMD_EDITOR_URI env var.
# editor_uri: "vscode://file{path}:{line}:{col}"

# ─── Remote model APIs (optional for lexical search and document reads) ──────
# Model-backed operations require explicitly configured remote APIs.
# Local inference and model downloads are retired; qmd init does not add models.
# Credentials are per operation: embeddings accept OPENAI_API_KEY (OpenAI) or
# VOYAGE_API_KEY (Voyage); Jev accepts TYPESAFE_API_KEY. Expansion and rerank do
# NOT inherit OPENAI_API_KEY: authenticated endpoints need their own *_api_key.
# Store real keys only in environment variables supported by that provider or
# an explicitly managed private config, never this checked-in example.
# YAML does not expand ${ENV_VAR} strings. Use one URL alias per operation.
# See the README for provider details and explicit embedding identity rebuilds.
# models:
#   embed_api_url: "https://api.openai.com/v1"
#   embed_api_model: "text-embedding-3-small"
#   embed_dimension: 1536
#   # embed_provider: openai             # inferred; use voyageai for Voyage
#   # embed_api_key: "<private-config-only>"  # overrides the embedding env key
#   # embed_cache_dir: ~/.cache/qmd/embeddings  # optional shared document cache
#   generate_api_url: "https://your-model-gateway.example/v1/chat/completions"
#   generate_api_model: "your-expansion-model"
#   # generate_api_key: "<private-config-only>"  # omit only for a keyless gateway
#   rerank_api_url: "https://your-reranker.example/v1/rerank"
#   rerank_api_model: "your-reranker"
#   # rerank_api_key: "<private-config-only>"    # omit only for a keyless gateway
#   # /rerank must return results[].{index,relevance_score} (Cohere shape).
#   # For chat scoring, use /v1/chat/completions instead; no URL discovery.
#   # jev_api_key: "<private-config-only>"      # or TYPESAFE_API_KEY
#   # jev_base_url: "https://your-jev-gateway.example"  # or TYPESAFE_BASE_URL
#   # jev_api_model: "jev-1.13"                # or TYPESAFE_DEFAULT_MODEL
#
# Vector layout conversion on a writable store open is separate from changing
# embedding identity: it copies existing bytes without a model request, but
# can discard unsupported/unreachable rows. Stop index holders and back up the
# database plus WAL/SHM before upgrading. Read-only MCP startup does not migrate.
# A model/provider/dimension change requires an explicit `qmd embed --force`.
# Doctor and cleanup --dry-run can initialize/migrate an older index too.
# --dry-run skips cleanup actions, not writable store initialization.

# ─── Collections ─────────────────────────────────────────────────────────────
collections:

  # ── Basic: just a path and a pattern ───────────────────────────────────────
  meetings:
    path: ~/Documents/Meetings
    pattern: "**/*.md"
    context:
      "/": "Meeting notes and summaries"

  # ── Hierarchical context: path-prefix → description ────────────────────────
  # Context is matched by path prefix; the most specific (longest) match wins.
  journals:
    path: ~/Documents/Notes
    pattern: "**/*.md"
    context:
      "/": "Personal notes vault"
      "/journal/2024": "Daily notes from 2024"
      "/journal/2025": "Daily notes from 2025"
      "/recipes": "Cooking recipes and meal planning"

  # ── Auto-update: run a command before re-indexing ──────────────────────────
  # On `qmd update`, this runs via `bash -c` in the collection's directory
  # BEFORE re-indexing. A non-zero exit aborts the whole `qmd update` run.
  # Set via CLI: qmd collection update-cmd wiki 'git pull --ff-only'
  wiki:
    path: ~/reference/wiki
    pattern: "**/*.md"
    update: "git pull --ff-only"
    context:
      "/": "External wiki — automatically pulled on every qmd update"

  # ── Ignore patterns: exclude files from indexing ───────────────────────────
  # YAML-only — there is no CLI command for this. Additive with the built-in
  # exclusions (node_modules, .git, .cache, vendor, dist, build), which you
  # cannot un-ignore. Non-markdown patterns work too.
  project-docs:
    path: ~/work/project
    pattern: "**/*.{md,mdx,txt}"
    ignore:
      - "drafts/**"           # skip draft documents
      - "*.tmp"               # skip temp files
      - "archive/2023/**"     # skip old archive
    context:
      "/": "Team project documentation"
      "/api": "API reference and endpoint docs"
      "/guides": "How-to guides and tutorials"

  # ── Exclude from default searches ──────────────────────────────────────────
  # includeByDefault: false → skipped unless you name it: qmd query -c vendor "..."
  # Set via CLI: qmd collection exclude vendor
  vendor:
    path: ~/work/vendor
    pattern: "**/*.md"
    includeByDefault: false
    context:
      "/": "Third-party vendor docs (excluded from default searches; use -c vendor)"

  # ── Everything together ────────────────────────────────────────────────────
  codex:
    path: ~/Documents/Codex
    pattern: "**/*.md"
    ignore:
      - "Sessions/**"
    update: "git pull --ff-only"
    includeByDefault: true    # true is the default; shown here for clarity
    context:
      "/": "Thematic collections of important concepts and discussions"
